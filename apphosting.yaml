runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: WEBHOOK_GENERATE_SUMMARIES
    value: "false"
    availability:
      - RUNTIME
  - variable: EXTENSION_API_ALLOWED_ORIGIN
    value: "*"
    availability:
      - RUNTIME
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: GITHUB_TOKEN
    secret: GITHUB_TOKEN
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  - variable: INGESTION_TRIGGER_SECRET
    secret: INGESTION_TRIGGER_SECRET
